<!DOCTYPE html>
<html>
<head>
    <title>Blood Donor Finder ......</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Fullscreen intro */
        #intro {
            position: fixed;
            top:0; left:0;
            width:100%;
            height:100%;
            background: white;
            display:flex;
            justify-content:center;
            align-items:flex-start;
            z-index: 9999;
            overflow: hidden;
        }

        /* Blood drop */
        #drop {
            width: 40px;
            height: 40px;
            background: #880808;
            border-radius: 50%;
            position: absolute;
            top: -50px;
            box-shadow: inset -4px -4px 8px rgba(0,0,0,0.3);
            animation: dropFall 1s forwards;
        }

        @keyframes dropFall {
            0% { top: -50px; }
            60% { top: 50%; transform: translateY(-50%) scale(1.2); }
            100% { top: 50%; transform: translateY(-50%) scale(1); }
        }

        /* Blood fill */
        #fill {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            background: #880808;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: fillScreen 1s forwards;
            animation-delay: 1.2s;
            z-index: 1000;
        }

        @keyframes fillScreen {
            0% { transform: translate(-50%, -50%) scale(0); }
            100% { transform: translate(-50%, -50%) scale(50); } /* large enough to cover screen */
        }

        /* Form container centered */
        .container {
            display: none;
            opacity: 0;
            background: white;
            border-radius: 20px;
            padding: 40px 50px;
            width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            color: #880808;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: opacity 1s ease;
            z-index: 10;
        }

        h2 { font-size: 28px; margin-bottom: 20px; }
        select, button { width: 280px; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #880808; font-size: 16px; }
        button { background: #880808; color: white; border: none; cursor: pointer; transition: 0.3s; }
        button:hover { background: #5c0505; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #880808; text-align: center; }
        th { background: #880808; color: white; }
        tr:nth-child(even){ background: #ffeaea; }
        tr:hover{ background: #ffcccc; }
        .no-donor { font-size: 22px; margin-top: 20px; }
        .no-donor i { font-size: 50px; margin-bottom: 10px; }
        .blood-icon {
            color: #880808;
            margin-right: 5px;
            font-size: 28px;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Intro -->
    <div id="intro">
        <div id="drop"></div>
        <div id="fill"></div>
    </div>

    <!-- Blood Donor Finder Form -->
    <div class="container" id="mainForm">
        <i class="fas fa-tint blood-icon"></i>
        <h2>Blood Donor Finder</h2>

        <select id="bloodGroup">
            <option value="" selected>All Blood Groups</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
        </select>
        <br>
        <select id="district">
            <option value="" selected>All Districts</option>
            <option value="Chennai">Chennai</option>
            <option value="Coimbatore">Coimbatore</option>
            <option value="Madurai">Madurai</option>
            <option value="Tiruchirappalli">Tiruchirappalli</option>
            <option value="Salem">Salem</option>
            <option value="Erode">Erode</option>
            <option value="Tirunelveli">Tirunelveli</option>
            <option value="Tiruppur">Tiruppur</option>
            <option value="Vellore">Vellore</option>
            <option value="Thoothukudi">Thoothukudi</option>
            <option value="Dindigul">Dindigul</option>
            <option value="Tiruvallur">Tiruvallur</option>
            <option value="Namakkal">Namakkal</option>
            <option value="Karur">Karur</option>
            <option value="Cuddalore">Cuddalore</option>
            <option value="Kanchipuram">Kanchipuram</option>
            <option value="Kanyakumari">Kanyakumari</option>
            <option value="Nagapattinam">Nagapattinam</option>
            <option value="Sivagangai">Sivagangai</option>
            <option value="Thanjavur">Thanjavur</option>
            <option value="Villupuram">Villupuram</option>
            <option value="Perambalur">Perambalur</option>
            <option value="Ramanathapuram">Ramanathapuram</option>
            <option value="Krishnagiri">Krishnagiri</option>
            <option value="Dharmapuri">Dharmapuri</option>
            <option value="Pudukkottai">Pudukkottai</option>
            <option value="The Nilgiris">The Nilgiris</option>
            <option value="Kallakurichi">Kallakurichi</option>
            <option value="Ranipet">Ranipet</option>
            <option value="Tenkasi">Tenkasi</option>
        </select>
        <br>
        <button onclick="searchDonors()">Search Donors</button>

        <div id="results"></div>
    </div>

    <script>
        const donors = [
            {name:"Alice", bloodGroup:"A+", district:"Chennai", phone:"1234567890"},
            {name:"Bob", bloodGroup:"B+", district:"Coimbatore", phone:"0987654321"},
            {name:"Carol", bloodGroup:"O+", district:"Madurai", phone:"1112223333"},
            {name:"David", bloodGroup:"AB-", district:"Tiruchirappalli", phone:"4445556666"},
            {name:"Eve", bloodGroup:"A-", district:"Salem", phone:"5556667777"},
            {name:"Frank", bloodGroup:"B-", district:"Erode", phone:"8889990000"},
            {name:"Grace", bloodGroup:"O-", district:"Tirunelveli", phone:"3334445555"},
            {name:"Heidi", bloodGroup:"AB+", district:"Tiruppur", phone:"6667778888"},
            {name:"Ivan", bloodGroup:"A+", district:"Vellore", phone:"1113335555"},
            {name:"Judy", bloodGroup:"B+", district:"Thoothukudi", phone:"2224446666"},
	    	{name:"Sameera", bloodGroup:"AB+", district:"Tenkasi", phone:"2221126666"},
	    	{name:"Mani", bloodGroup:"B+", district:"Tenkasi", phone:"2241126666"}
			{name:"Madhu", bloodGroup:"A+", district:"Tirunelveli", phone:"2247845151"}
        ];

        function searchDonors(){
            const blood = document.getElementById('bloodGroup').value;
            const district = document.getElementById('district').value;
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = "";

            const filtered = donors.filter(d => 
                (blood === "" || d.bloodGroup === blood) &&
                (district === "" || d.district === district)
            );

            if(filtered.length === 0){
                resultsDiv.innerHTML = `<div class="no-donor">
                    <i class="fas fa-heart-broken"></i><br>
                    Sorry! No donors found.
                </div>`;
            } else {
                let table = `<table>
                    <tr>
                        <th>Name</th>
                        <th>Blood Group</th>
                        <th>District</th>
                        <th>Phone</th>
                    </tr>`;
                filtered.forEach(d => {
                    table += `<tr>
                        <td><i class="fas fa-tint blood-icon"></i>${d.name}</td>
                        <td>${d.bloodGroup}</td>
                        <td>${d.district}</td>
                        <td>${d.phone}</td>
                    </tr>`;
                });
                table += `</table>`;
                resultsDiv.innerHTML = table;
            }
        }

        // Animation sequence
        const fill = document.getElementById('fill');
        const intro = document.getElementById('intro');
        const mainForm = document.getElementById('mainForm');

        fill.addEventListener('animationend', () => {
            intro.style.display = 'none';
            mainForm.style.display = 'block';
            setTimeout(()=>{ mainForm.style.opacity = 1; }, 100);
        });
    </script>
</body>
</html>
