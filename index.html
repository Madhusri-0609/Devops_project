<!DOCTYPE html>
<html>
<head>
    <title>Blood Donor Finder</title>
    <!-- FontAwesome for blood drop icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #880808; /* Blood Red background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            padding: 50px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            width: 400px;
        }

        .container i {
            font-size: 60px;
            color: #880808; /* Blood Red icon */
            margin-bottom: 20px;
        }

        h2 {
            color: #880808; /* Blood Red heading */
            margin-bottom: 30px;
            font-size: 28px;
        }

        select {
            width: 260px;
            padding: 12px;
            margin: 15px 0;
            border-radius: 10px;
            border: 1px solid #880808;
            font-size: 16px;
        }

        input[type="submit"] {
            background-color: #880808; /* Blood Red button */
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        input[type="submit"]:hover {
            background-color: #5c0505; /* Darker Blood Red hover */
        }
    </style>
    <script>
        function validateForm() {
            let blood = document.forms["donorForm"]["bloodGroup"].value;
            let city = document.forms["donorForm"]["city"].value;
            if (blood === "" || city === "") {
                alert("Please select both Blood Group and District!");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <div class="container">
        <i class="fas fa-tint"></i> <!-- blood drop icon -->
        <h2>Blood Donor Finder</h2>
        <form name="donorForm" action="DonorFinderServlet" method="post" onsubmit="return validateForm()">
            <select name="bloodGroup" required>
                <option value="" disabled selected>Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
            <br>
            <select name="city" required>
                <option value="" disabled selected>Select District</option>
                <option value="Chennai">Chennai</option>
                <option value="Coimbatore">Coimbatore</option>
                <option value="Madurai">Madurai</option>
                <option value="Tiruchirappalli">Tiruchirappalli</option>
                <option value="Salem">Salem</option>
                <option value="Erode">Erode</option>
                <option value="Tirunelveli">Tirunelveli</option>
                <option value="Tiruppur">Tiruppur</option>
                <option value="Vellore">Vellore</option>
                <option value="Thoothukudi">Thoothukudi</option>
                <option value="Dindigul">Dindigul</option>
                <option value="Tiruvallur">Tiruvallur</option>
                <option value="Namakkal">Namakkal</option>
                <option value="Karur">Karur</option>
                <option value="Cuddalore">Cuddalore</option>
                <option value="Kanchipuram">Kanchipuram</option>
                <option value="Kanyakumari">Kanyakumari</option>
                <option value="Nagapattinam">Nagapattinam</option>
                <option value="Sivagangai">Sivagangai</option>
            </select>
            <br>
            <input type="submit" value="Search Donors">
        </form>
    </div>
</body>
</html>
